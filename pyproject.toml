[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finegrained-compcars"
version = "0.1.0"
description = "Fine-grained vehicle classification with Focal Loss and part-based voting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "torchsummary>=1.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]
